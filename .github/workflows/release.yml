name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build
        shell: bash
        run: |
          go build -trimpath -ldflags="-s -w" -o wsl-lan-bridge.exe ./cmd/wsl-lan-bridge
          ls -lh wsl-lan-bridge.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: wsl-lan-bridge.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
